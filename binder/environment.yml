channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11.2
  - pip

  # Data analysis
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - altair
  - statsmodels
  - plotnine

  # Geospatial
  - gdal=3.10.1  # Version with Parquet support
  - fiona
  - geopandas
  - shapely
  - libgdal-arrow-parquet  # Explicit Parquet support
  - arrow-cpp=14.0.1
  - parquet-cpp=14.0.1

  # Notebook & Visualization
  - notebook
  - ipywidgets
  - ipython-sql
  - jupyterlab
  - nbgitpuller>=1.1.0

  # Data processing
  - csvkit
  - lxml
  - chardet
  - openpyxl
  - pyarrow=14.0.1  # Usiamo la versione compatibile con arrow-cpp

  # Web & APIs
  - httpie
  - requests
  - beautifulsoup4
  - selenium

  # Pip packages
  - pip:
    - bash_kernel
    - yq
    - requests-html
    - csvs-to-sqlite
    - goodtables
    - daff
    - visidata
    - scrape-cli
    - llm
    - shot-scraper
    - ttok
    - strip-tags
    - pandas-profiling
