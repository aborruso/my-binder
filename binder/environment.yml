channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11.2
  - pip
  - sqlite=3.45.1

  # Data analysis
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - altair
  - statsmodels
  - plotnine

  # Geospatial
  - gdal
  - fiona
  - geopandas
  - shapely

  # Notebook & Visualization
  - notebook
  - ipywidgets
  - ipython-sql
  - jupyterlab
  - nbgitpuller>=1.1.0

  # Data processing
  - csvkit
  - lxml
  - chardet
  - openpyxl

  # Web & APIs
  - httpie
  - requests
  - beautifulsoup4
  - selenium

  # Image processing
  - imagemagick

  ## Pip packages
  - pip:
    - bash_kernel
    - yq
    - requests-html
    - csvs-to-sqlite
    - goodtables
    - daff
    - visidata
    - scrape-cli
    - llm
    - shot-scraper
    - ttok
    - strip-tags
    - pandas-profiling
