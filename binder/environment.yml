channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11.2
  - pip

  # Data analysis
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - altair
  - statsmodels
  - plotnine

  # Geospatial
  - gdal=3.8.0
  - fiona=1.9.0
  - geopandas=0.14.0
  - shapely=2.0.1
  - pyarrow=14.0.1
  - libgdal-arrow-parquet  # Versione automatica compatibile con GDAL

  # Notebook & Visualization
  - notebook
  - ipywidgets
  - ipython-sql
  - jupyterlab
  - nbgitpuller>=1.1.0

  # Data processing
  - csvkit
  - lxml
  - chardet
  - openpyxl

  # Web & APIs
  - httpie
  - requests
  - beautifulsoup4
  - selenium

  # Pip packages
  - pip:
    - bash_kernel
    - yq
    - requests-html
    - csvs-to-sqlite
    - goodtables
    - daff
    - visidata
    - scrape-cli
    - llm
    - shot-scraper
    - ttok
    - strip-tags
    - pandas-profiling
