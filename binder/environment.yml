channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11.2
  - pip

  # Data analysis
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - altair
  - statsmodels
  - plotnine

  # Geospatial
  - gdal=3.10.1  # Version with Parquet support
  - pyarrow     # Arrow/Parquet library
  - fiona
  - geopandas
  - shapely

  # Notebook & Visualization
  - notebook
  - ipywidgets
  - ipython-sql
  - jupyterlab

  # Data processing
  - csvkit
  - lxml
  - chardet
  - openpyxl

  # Web & APIs
  - httpie
  - requests
  - beautifulsoup4
  - selenium

  # Pip packages
  - pip:
    - bash_kernel
    - yq
    - requests-html
    - csvs-to-sqlite
    - goodtables
    - daff
    - visidata
    - scrape-cli
    - llm
    - shot-scraper
    - ttok
    - strip-tags
    - pandas-profiling
    - pyarrow  # For better pandas performance
    - nbgitpuller
